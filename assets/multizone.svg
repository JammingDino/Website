<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'JetBrains Mono',monospace">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/><stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgM)"/>

  <!-- window chrome -->
  <rect x="40" y="40" width="720" height="420" rx="14" fill="#101010" stroke="#262626"/>
  <circle cx="64" cy="64" r="5" fill="#3a3a3a"/><circle cx="82" cy="64" r="5" fill="#3a3a3a"/><circle cx="100" cy="64" r="5" fill="#ff4d00"/>
  <line x1="40" y1="84" x2="760" y2="84" stroke="#262626"/>

  <!-- sidebar: zones -->
  <rect x="40" y="84" width="180" height="376" fill="#0c0c0c"/>
  <line x1="220" y1="84" x2="220" y2="460" stroke="#262626"/>
  <text x="60" y="116" fill="#7d7a72" font-size="11" letter-spacing="2">ZONES</text>
  <rect x="56" y="130" width="148" height="34" rx="7" fill="#1a1a1a" stroke="#ff4d00"/>
  <circle cx="74" cy="147" r="4" fill="#ff4d00"/><text x="88" y="151" fill="#f4f1ea" font-size="12">Leader</text>
  <rect x="56" y="172" width="148" height="34" rx="7" fill="#141414"/>
  <circle cx="74" cy="189" r="4" fill="#ff8a4c"/><text x="88" y="193" fill="#c8c5bd" font-size="12">Researcher</text>
  <rect x="56" y="214" width="148" height="34" rx="7" fill="#141414"/>
  <circle cx="74" cy="231" r="4" fill="#ff8a4c"/><text x="88" y="235" fill="#c8c5bd" font-size="12">Coder</text>
  <rect x="56" y="256" width="148" height="34" rx="7" fill="#141414"/>
  <circle cx="74" cy="273" r="4" fill="#7d7a72"/><text x="88" y="277" fill="#c8c5bd" font-size="12">Offline · local</text>

  <!-- chat area: messages -->
  <rect x="244" y="110" width="300" height="44" rx="10" fill="#1a1a1a"/>
  <text x="262" y="130" fill="#7d7a72" font-size="11">user</text>
  <text x="262" y="146" fill="#f4f1ea" font-size="12">Plan and build the feature.</text>

  <rect x="320" y="170" width="416" height="92" rx="10" fill="#181410" stroke="#332015"/>
  <text x="338" y="190" fill="#ff4d00" font-size="11">leader · streaming</text>
  <rect x="338" y="202" width="380" height="7" rx="3" fill="#2a2a2a"/>
  <rect x="338" y="216" width="340" height="7" rx="3" fill="#2a2a2a"/>
  <rect x="338" y="230" width="300" height="7" rx="3" fill="#2a2a2a"/>
  <rect x="338" y="244" width="120" height="7" rx="3" fill="#ff4d00"/>

  <!-- tool approval chip -->
  <rect x="320" y="278" width="220" height="34" rx="8" fill="#141414" stroke="#ff4d00"/>
  <text x="338" y="299" fill="#ff8a4c" font-size="11">⚙ run_tool() — approve?</text>

  <!-- multi-agent orchestration nodes -->
  <g transform="translate(600,300)">
    <circle cx="0" cy="0" r="16" fill="#ff4d00"/>
    <line x1="0" y1="16" x2="-40" y2="70" stroke="#ff8a4c" stroke-width="1.5"/>
    <line x1="0" y1="16" x2="0" y2="70" stroke="#ff8a4c" stroke-width="1.5"/>
    <line x1="0" y1="16" x2="40" y2="70" stroke="#ff8a4c" stroke-width="1.5"/>
    <circle cx="-40" cy="80" r="8" fill="#f4f1ea"/>
    <circle cx="0" cy="80" r="8" fill="#f4f1ea"/>
    <circle cx="40" cy="80" r="8" fill="#f4f1ea"/>
  </g>

  <!-- input bar -->
  <rect x="244" y="420" width="492" height="30" rx="8" fill="#0c0c0c" stroke="#262626"/>
  <text x="262" y="440" fill="#7d7a72" font-size="12">Message MultiZone…</text>

  <text x="756" y="486" fill="#7d7a72" font-size="12" text-anchor="end" letter-spacing="1">TAURI · RUST + REACT/TS · SQLITE</text>
