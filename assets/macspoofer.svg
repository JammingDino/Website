<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'JetBrains Mono',monospace">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141210"/><stop offset="1" stop-color="#0d0c0b"/>
    </linearGradient>
    <marker id="arrM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff4d00"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="url(#bgM)"/>

  <!-- ░ packet rewrite chips ░ -->
  <text x="400" y="92" fill="#ff8a4c" font-size="12" letter-spacing="2" text-anchor="middle">REWRITE IDENTITY</text>
  <path d="M362 120 C392 100 408 100 438 120" fill="none" stroke="#ff4d00" stroke-width="2" marker-end="url(#arrM)"/>

  <!-- original frame (dropped) -->
  <g>
    <rect x="196" y="120" width="176" height="48" rx="9" fill="#1a1a1a" stroke="#4a3a32"/>
    <text x="210" y="142" fill="#c8c5bd" font-size="11">SRC AA:BB:CC:00:11:22</text>
    <text x="210" y="160" fill="#ff6a3d" font-size="10" letter-spacing="1">✕ ORIGINAL — DROPPED</text>
  </g>

  <!-- cloned frame (forwarded) -->
  <g>
    <rect x="438" y="120" width="176" height="48" rx="9" fill="#1a1a1a" stroke="#ff4d00"/>
    <text x="452" y="142" fill="#f4f1ea" font-size="11">SRC DE:AD:BE:EF:00:01</text>
    <text x="452" y="160" fill="#ff8a4c" font-size="10" letter-spacing="1">→ CLONE — FORWARDED</text>
  </g>

  <!-- ░ network rail ░ -->
  <line x1="196" y1="300" x2="330" y2="300" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="470" y1="300" x2="604" y2="300" stroke="#ff4d00" stroke-width="2"/>
  <!-- flow chevrons on spoofed leg -->
  <g fill="none" stroke="#ff8a4c" stroke-width="2" stroke-linecap="round">
    <path d="M512 294 l7 6 l-7 6"/><path d="M536 294 l7 6 l-7 6"/><path d="M560 294 l7 6 l-7 6"/>
  </g>

  <!-- ░ camera (left) ░ -->
  <g>
    <rect x="96" y="276" width="86" height="48" rx="7" fill="#161514" stroke="#3a3a3a"/>
    <circle cx="120" cy="300" r="13" fill="none" stroke="#c8c5bd" stroke-width="2"/>
    <circle cx="120" cy="300" r="5" fill="#7d7a72"/>
    <rect x="158" y="284" width="16" height="6" rx="3" fill="#1a1a1a" stroke="#3a3a3a"/>
    <circle cx="170" cy="282" r="3" fill="#ff4d00"/>
    <text x="139" y="350" fill="#f4f1ea" font-size="12" letter-spacing="1" text-anchor="middle">ONVIF CAMERA</text>
    <text x="139" y="368" fill="#7d7a72" font-size="10" text-anchor="middle">blocked MAC</text>
  </g>

  <!-- ░ orange pi bridge (center) ░ -->
  <g>
    <rect x="330" y="262" width="140" height="76" rx="9" fill="#161514" stroke="#ff4d00" stroke-width="1.5"/>
    <!-- gpio header -->
    <g fill="#2a2a2a">
      <rect x="344" y="270" width="5" height="5"/><rect x="354" y="270" width="5" height="5"/>
      <rect x="364" y="270" width="5" height="5"/><rect x="374" y="270" width="5" height="5"/>
      <rect x="384" y="270" width="5" height="5"/><rect x="394" y="270" width="5" height="5"/>
      <rect x="404" y="270" width="5" height="5"/><rect x="414" y="270" width="5" height="5"/>
    </g>
    <!-- soc -->
    <rect x="378" y="288" width="32" height="32" rx="3" fill="#1a1a1a" stroke="#3a3a3a"/>
    <!-- eth ports in/out -->
    <rect x="322" y="292" width="12" height="20" rx="2" fill="#1a1a1a" stroke="#3a3a3a"/>
    <rect x="466" y="292" width="12" height="20" rx="2" fill="#1a1a1a" stroke="#ff4d00"/>
    <text x="400" y="360" fill="#f4f1ea" font-size="13" letter-spacing="1" text-anchor="middle">ORANGE PI</text>
    <text x="400" y="378" fill="#7d7a72" font-size="10" letter-spacing="1" text-anchor="middle">TRANSPARENT L2 BRIDGE</text>
  </g>

  <!-- ░ network (right) ░ -->
  <g>
    <rect x="604" y="270" width="104" height="60" rx="8" fill="#161514" stroke="#3a3a3a"/>
    <g fill="#2a2a2a">
      <rect x="618" y="312" width="14" height="8" rx="2"/><rect x="638" y="312" width="14" height="8" rx="2" fill="#ff4d00"/>
      <rect x="658" y="312" width="14" height="8" rx="2"/><rect x="678" y="312" width="14" height="8" rx="2"/>
    </g>
    <path d="M656 270 v-16 m-8 8 l8 -8 l8 8" fill="none" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="656" y="296" fill="#f4f1ea" font-size="12" letter-spacing="1" text-anchor="middle">LAN / WAN</text>
    <text x="656" y="360" fill="#7d7a72" font-size="10" text-anchor="middle">switch · uplink</text>
  </g>

  <!-- leg labels -->
  <text x="256" y="290" fill="#7d7a72" font-size="9" letter-spacing="1" text-anchor="middle">INTERCEPT</text>
  <text x="537" y="288" fill="#ff8a4c" font-size="9" letter-spacing="1" text-anchor="middle">SPOOFED</text>

  <!-- titles -->
  <text x="44" y="56" fill="#f4f1ea" font-size="22" letter-spacing="1" opacity="0.9">MAC SPOOFER</text>
  <text x="44" y="470" fill="#7d7a72" font-size="13" letter-spacing="2">TRANSPARENT LAYER-2 SPOOFING BRIDGE</text>
</svg>
