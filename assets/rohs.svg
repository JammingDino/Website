<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'JetBrains Mono',monospace">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141210"/><stop offset="1" stop-color="#0d0c0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgD)"/>

  <!-- document -->
  <rect x="250" y="70" width="300" height="360" rx="10" fill="#161514" stroke="#262626"/>
  <text x="276" y="112" fill="#f4f1ea" font-size="16" letter-spacing="1">CERTIFICATE</text>
  <text x="276" y="132" fill="#7d7a72" font-size="11">RoHS 2011/65/EU</text>
  <!-- text rows -->
  <g fill="#2a2a2a">
    <rect x="276" y="156" width="248" height="8" rx="4"/>
    <rect x="276" y="176" width="210" height="8" rx="4"/>
    <rect x="276" y="196" width="230" height="8" rx="4"/>
  </g>
  <!-- substance table -->
  <g font-size="11">
    <rect x="276" y="222" width="248" height="26" fill="#1a1a1a"/>
    <text x="288" y="240" fill="#c8c5bd">Lead (Pb)</text><text x="512" y="240" fill="#ff8a4c" text-anchor="end">PASS</text>
    <rect x="276" y="252" width="248" height="26" fill="#141414"/>
