  </g>
  <!-- compliant badge -->
  <g transform="translate(400,360)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ff4d00" stroke-width="3"/>
    <path d="M-15 0 l10 12 l20 -24" fill="none" stroke="#ff4d00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- scan line -->
  <rect x="250" y="240" width="300" height="3" fill="#ff4d00" opacity="0.8"/>
  <text x="560" y="244" fill="#ff4d00" font-size="11">◀ SCANNING</text>

  <!-- AI agent tag -->
  <rect x="276" y="392" width="150" height="26" rx="13" fill="#141414" stroke="#ff4d00"/>
