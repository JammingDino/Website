  <text x="44" y="56" fill="#f4f1ea" font-size="22" letter-spacing="1" opacity="0.9">RoHS SCRAPER</text>
  <text x="44" y="470" fill="#7d7a72" font-size="13" letter-spacing="2">AUTOMATED COMPLIANCE EXTRACTION</text>
